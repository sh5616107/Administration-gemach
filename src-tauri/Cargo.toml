[package]
name = "gemach-manager"
version = "4.3.7"
description = "מינהל הגמ\"ח - מערכת ניהול גמ\"ח כספים"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.6", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encryption dependencies
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
subtle = "2.5"
hex = "0.4"
# Async runtime
tokio = { version = "1", features = ["full"] }
# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }
# Date/time handling
chrono = "0.4"
# Regex for parsing
regex = "1"
# Futures for async utilities
futures = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true


