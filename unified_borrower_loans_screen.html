<div dir="rtl" style="font-family: var(--font-sans);">

<div style="display:grid; grid-template-columns: 320px minmax(0,1fr); gap:1rem;">

  <!-- Left: Borrower details -->
  <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1rem 1.25rem;">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <div style="width:44px; height:44px; border-radius:50%; background:var(--color-background-info); display:flex; align-items:center; justify-content:center; font-weight:500; font-size:14px; color:var(--color-text-info);">אב</div>
      <div>
        <p style="font-weight:500; font-size:15px; margin:0;">אבא</p>
        <p style="font-size:13px; color:var(--color-text-secondary); margin:0;">לווה פעיל</p>
      </div>
    </div>

    <div style="border-top:0.5px solid var(--color-border-tertiary); padding-top:12px;">
      <table style="width:100%; font-size:13px; border-collapse:collapse;">
        <tr><td style="color:var(--color-text-secondary); padding:6px 0;"><i class="ti ti-id" style="font-size:16px; vertical-align:-2px; margin-left:6px" aria-hidden="true"></i>ת.ז.</td><td style="text-align:left; padding:6px 0;">123456789</td></tr>
        <tr><td style="color:var(--color-text-secondary); padding:6px 0;"><i class="ti ti-phone" style="font-size:16px; vertical-align:-2px; margin-left:6px" aria-hidden="true"></i>טלפון</td><td style="text-align:left; padding:6px 0;">050-1234567</td></tr>
        <tr><td style="color:var(--color-text-secondary); padding:6px 0;"><i class="ti ti-map-pin" style="font-size:16px; vertical-align:-2px; margin-left:6px" aria-hidden="true"></i>עיר</td><td style="text-align:left; padding:6px 0;">תל אביב</td></tr>
        <tr><td style="color:var(--color-text-secondary); padding:6px 0;"><i class="ti ti-mail" style="font-size:16px; vertical-align:-2px; margin-left:6px" aria-hidden="true"></i>אימייל</td><td style="text-align:left; padding:6px 0; color:var(--color-text-info);">aba@mail.com</td></tr>
      </table>
    </div>

    <div style="border-top:0.5px solid var(--color-border-tertiary); margin-top:12px; padding-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:8px;">
      <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.75rem;">
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 4px;">סה״כ הלוואות</p>
        <p style="font-size:20px; font-weight:500; margin:0;">15</p>
      </div>
      <div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:0.75rem;">
        <p style="font-size:12px; color:var(--color-text-secondary); margin:0 0 4px;">יתרה כוללת</p>
        <p style="font-size:20px; font-weight:500; margin:0;">₪400</p>
      </div>
    </div>

    <button style="width:100%; margin-top:12px; display:flex; align-items:center; justify-content:center; gap:6px;">
      <i class="ti ti-edit" aria-hidden="true" style="font-size:16px;"></i>
      עריכת פרטי לווה
    </button>
  </div>

  <!-- Right: Loans list -->
  <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:1rem 1.25rem; position:relative; overflow:hidden;">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="margin:0;">הלוואות הלווה</h3>
      <button id="newLoanBtn" style="display:flex; align-items:center; gap:6px;">
        <i class="ti ti-plus" aria-hidden="true" style="font-size:16px;"></i>
        הלוואה חדשה
      </button>
    </div>

    <div id="loanList" style="display:flex; flex-direction:column; gap:6px;">
      <!-- rows generated by JS -->
    </div>

    <!-- Side panel overlay -->
    <div id="panelOverlay" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.25); z-index:5;">
      <div id="sidePanel" style="position:absolute; top:0; left:0; bottom:0; width:78%; max-width:480px; background:var(--color-background-primary); border-right:0.5px solid var(--color-border-secondary); box-shadow: 0 0 0 1px transparent; padding:1.25rem; overflow:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h3 id="panelTitle" style="margin:0;">פרטי הלוואה</h3>
          <button id="closePanel" aria-label="סגירה" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center;">
            <i class="ti ti-x" aria-hidden="true" style="font-size:18px;"></i>
          </button>
        </div>

        <div id="panelBody" style="display:flex; flex-direction:column; gap:0.9rem;">
          <!-- filled by JS -->
        </div>

        <div style="display:flex; gap:8px; margin-top:1.5rem;">
          <button id="saveLoanBtn" style="flex:1; background:var(--color-background-info); color:var(--color-text-info); border-color:var(--color-border-info);">שמירה</button>
          <button id="cancelLoanBtn" style="flex:1;">ביטול</button>
        </div>
      </div>
    </div>

  </div>

</div>

</div>

<script>
const loans = [
  {amt:400, paid:0, status:'הלוואה', due:'15/6/2026', id:'7fb..a888'},
  {amt:400, paid:400, status:'הלוואה', due:'26/4/2026', id:'8007..0480'},
  {amt:400, paid:400, status:'הלוואה', due:'26/4/2026', id:'da94..0b13'},
  {amt:400, paid:400, status:'הלוואה', due:'26/4/2026', id:'bd54..592a'},
  {amt:400, paid:400, status:'הלוואה', due:'25/4/2026', id:'01c..6ad'},
];

const list = document.getElementById('loanList');
const overlay = document.getElementById('panelOverlay');
const panelBody = document.getElementById('panelBody');
const panelTitle = document.getElementById('panelTitle');

function field(label, value, type='text'){
  return `<div>
    <label style="display:block; font-size:13px; color:var(--color-text-secondary); margin-bottom:4px;">${label}</label>
    <input type="${type}" value="${value}" style="width:100%;" />
  </div>`;
}

function renderLoanForm(loan){
  panelTitle.textContent = loan ? 'פרטי הלוואה' : 'הלוואה חדשה';
  const a = loan || {amt:'', paid:0, status:'הלוואה', due:''};
  panelBody.innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      ${field('סכום ההלוואה', a.amt)}
      ${field('שולם', a.paid)}
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      ${field('תאריך', a.due, 'text')}
      <div>
        <label style="display:block; font-size:13px; color:var(--color-text-secondary); margin-bottom:4px;">סטטוס</label>
        <select style="width:100%;">
          <option ${a.status==='הלוואה'?'selected':''}>הלוואה</option>
          <option ${a.status==='שולם'?'selected':''}>שולם</option>
        </select>
      </div>
    </div>
    <div>
      <label style="display:block; font-size:13px; color:var(--color-text-secondary); margin-bottom:4px;">הערה</label>
      <textarea rows="3" style="width:100%; resize:vertical;"></textarea>
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:14px;">
      <input type="checkbox" style="width:auto;" />
      תזכורת אוטומטית
    </label>
  `;
}

function renderList(){
  list.innerHTML = '';
  loans.forEach((loan, i) => {
    const remaining = loan.amt - loan.paid;
    const row = document.createElement('div');
    row.style = 'display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-md); cursor:pointer; transition:background 0.15s;';
    row.onmouseenter = () => row.style.background = 'var(--color-background-secondary)';
    row.onmouseleave = () => row.style.background = 'transparent';

    row.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="background:var(--color-background-${remaining>0?'amber':'success'}); color:var(--color-text-${remaining>0?'amber':'success'}); font-size:12px; padding:3px 10px; border-radius:var(--border-radius-md);">
          ${remaining>0?'פתוחה':'שולמה'}
        </span>
        <span style="font-size:14px;">${loan.due}</span>
      </div>
      <div style="display:flex; align-items:center; gap:16px; font-size:13px; color:var(--color-text-secondary);">
        <span>סכום: <strong style="color:var(--color-text-primary); font-weight:500;">₪${loan.amt}</strong></span>
        <span>נותר: <strong style="color:var(--color-text-primary); font-weight:500;">₪${remaining}</strong></span>
        <i class="ti ti-chevron-left" aria-hidden="true" style="font-size:16px;"></i>
      </div>
    `;

    row.onclick = () => { renderLoanForm(loan); overlay.style.display = 'block'; };
    list.appendChild(row);
  });
}

renderList();

document.getElementById('newLoanBtn').onclick = () => { renderLoanForm(null); overlay.style.display = 'block'; };
document.getElementById('closePanel').onclick = () => overlay.style.display = 'none';
document.getElementById('cancelLoanBtn').onclick = () => overlay.style.display = 'none';
document.getElementById('saveLoanBtn').onclick = () => overlay.style.display = 'none';
overlay.onclick = (e) => { if(e.target === overlay) overlay.style.display = 'none'; };
</script>
