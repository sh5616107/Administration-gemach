name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: npm ci
      
      - name: Decode signing key
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.TAURI_PRIVATE_KEY }}")
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing-key.key", $bytes)
      
      - name: Debug signing key file
        shell: pwsh
        run: |
          $path = "$env:RUNNER_TEMP\signing-key.key"
          $lines = Get-Content $path
          Write-Host "Line count: $($lines.Count)"
          Write-Host "First line: $($lines[0])"
      
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}\signing-key.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'גרסה __VERSION__'
          releaseBody: |
            ## שינויים בגרסה זו
            
            עדכונים וטיוטים
            
            ### הורדה
            הורד את הקובץ המתאים למערכת ההפעלה שלך מהקבצים למטה.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
