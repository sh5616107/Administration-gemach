name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'גרסה __VERSION__'
          releaseBody: |
            ## שינויים בגרסה __VERSION__
            
            ### ✨ תכונות חדשות
            - מערכת עדכונים אוטומטיים - בדיקה אוטומטית + כפתור ידני בהגדרות
            - Dialog משופר עם "מה חדש" ו-progress bar להורדה
            - תמיכה בחתימה דיגיטלית לאבטחת עדכונים
            
            ### 🔧 שיפורים
            - שילוב בנקים הוסתר זמנית עד להשלמת הפיתוח
            - עדכון תלויות ותצורות
            
            ### 📚 תיעוד
            - `AUTO_UPDATE_SETUP.md` - הוראות הגדרה מפורטות
            - `QUICK_UPDATE_GUIDE.md` - מדריך מהיר
            
            ### 📥 הורדה והתקנה
            הורד את הקובץ המתאים למערכת ההפעלה שלך מהקבצים למטה.
            
            לפרטים נוספים ראה [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
