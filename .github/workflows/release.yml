name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'גרסה __VERSION__'
          releaseBody: |
            ## שינויים בגרסה __VERSION__
            
            ### תיקוני באגים
            - **תיקון זרימת אישור בקשות מתור ההלוואות** - הלוואה שסומנה כ"ניתנה" בתור עכשיו מתעדכנת ומוסרת כראוי מהתור
            - **תיקון באג בעדכון תאריך הפקדה** - עדכון הפקדה עם template string מרובה שורות עובד כראוי
            - **תיקון באג בהנפקת שטר עם ערבים** - שטרות שהופקו מחוץ לדיאלוג עכשיו כוללים פרטי ערבים
            
            ### הורדה והתקנה
            הורד את הקובץ המתאים למערכת ההפעלה שלך מהקבצים למטה.
            
            לפרטים נוספים ראה [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
