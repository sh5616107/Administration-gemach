name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'גרסה __VERSION__'
          releaseBody: |
            ## שינויים בגרסה __VERSION__
            
            ### 🗑️ הסרת תכונות
            - **הסרת תכונת מסגרת מותאמת אישית** - התכונה הוסרה זמנית בשל בעיות טכניות ב-PDF generation
              - הוסרו שדות העלאת מסגרת מעמוד ההגדרות
              - הוסרו שדות כיול שוליים
              - כל המסמכים חוזרים להדפסה רגילה (עם לוגו בלבד)
              - התכונה תחזור בגרסה עתידית לאחר פתרון מלא
            
            ### � שיפורים
            - שיפור מנגנון הדפסת מסמכים - חזרה למנגנון יציב של `printHtml()`
            - עדכון הודעות למשתמש בממשק ההגדרות
            - ניקוי קוד והסרת לוגיקה מיותרת
            
            ### � תיקונים טכניים
            - החזרת `downloadPdf()` למצב פשוט ויציב
            - תיקון בעיות ב-HTML parsing ו-canvas rendering
            
            ### 📝 הערות
            - משתמשים עם מסגרות קיימות - המסמכים יודפסו עם לוגו רגיל בלבד
            - תכונת המסגרת תחזור לאחר פתרון מקיף של מנגנון ה-PDF
            
            ### 📥 הורדה והתקנה
            הורד את הקובץ המתאים למערכת ההפעלה שלך מהקבצים למטה.
            
            לפרטים נוספים ראה [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
